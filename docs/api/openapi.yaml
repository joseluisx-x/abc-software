openapi: 3.1.0
info:
  title: ABC Software - API de facturación e inventario
  version: 0.1.0
  description: >-
    Contrato preliminar. Los códigos, reglas tributarias, requisitos de identidad
    y políticas de envío marcados POR VERIFICAR requieren contraste con SUNAT.
servers:
  - url: /api/v1
    description: Base relativa; URL de despliegue POR VERIFICAR.
tags:
  - name: Auth
  - name: Clientes
  - name: Productos
  - name: Inventario
  - name: Comprobantes
  - name: Envíos
  - name: Resúmenes
  - name: Migración
paths:
  /auth/token:
    post:
      tags: [Auth]
      operationId: createAccessToken
      security: []
      summary: Obtener token de acceso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
            example: { username: "cajero.01", password: "<secreto-no-incluir>" }
      responses:
        "200":
          description: Token emitido.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, const: Bearer }
                  expiresIn: { type: integer, minimum: 1 }
              example: { accessToken: "<token-redactado>", tokenType: "Bearer", expiresIn: 900 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /clientes:
    get:
      tags: [Clientes]
      operationId: listCustomers
      summary: Buscar clientes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: numeroDocumento
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Página de clientes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "../contracts/SCHEMAS/customer.schema.json" }
                  nextCursor: { type: [string, "null"] }
              example:
                items:
                  - tipoDocumento: "6"
                    numeroDocumento: "20123456789"
                    nombreLegal: "Cliente de prueba S.A.C."
                    direccion: "Dirección de ejemplo"
                nextCursor: null
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Clientes]
      operationId: createCustomer
      summary: Registrar cliente
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contracts/SCHEMAS/customer.schema.json" }
            example:
              tipoDocumento: "6"
              numeroDocumento: "20123456789"
              nombreLegal: "Cliente de prueba S.A.C."
      responses:
        "201":
          description: Cliente registrado.
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/customer.schema.json" }
              example:
                id: "56a72ec0-51be-4db2-bcea-1e74d6520bda"
                tipoDocumento: "6"
                numeroDocumento: "20123456789"
                nombreLegal: "Cliente de prueba S.A.C."
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /clientes/validaciones-ruc:
    post:
      tags: [Clientes]
      operationId: validateRuc
      summary: Solicitar validación de RUC
      description: >-
        El formato/checksum local no acredita estado registral. La consulta externa,
        disponibilidad y significado de la respuesta SUNAT están POR VERIFICAR.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ruc]
              properties:
                ruc: { type: string, pattern: "^[0-9]{11}$" }
            example: { ruc: "20123456789" }
      responses:
        "200":
          description: Resultado de validación con fuente y hora.
          content:
            application/json:
              schema:
                type: object
                required: [ruc, checksumValido, consultadoEn]
                properties:
                  ruc: { type: string }
                  checksumValido: { type: boolean }
                  consultaRegistral: { type: [string, "null"], enum: [VALID, INVALID, UNAVAILABLE, null] }
                  razonSocial: { type: [string, "null"] }
                  consultadoEn: { type: string, format: date-time }
              example:
                ruc: "20123456789"
                checksumValido: false
                consultaRegistral: null
                razonSocial: null
                consultadoEn: "2026-10-22T12:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /productos:
    get:
      tags: [Productos]
      operationId: listProducts
      summary: Consultar catálogo de productos
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: sku
          schema: { type: string }
        - in: query
          name: activo
          schema: { type: boolean }
      responses:
        "200":
          description: Productos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "../contracts/SCHEMAS/product.schema.json" }
              example:
                - sku: "ARR-001"
                  descripcion: "Arroz (producto de prueba)"
                  unidadMedida: "NIU"
                  precioUnitario: 12.5
                  codigoAfectacionIGV: "<codigo-por-verificar>"
                  activo: true
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Productos]
      operationId: createProduct
      summary: Registrar producto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contracts/SCHEMAS/product.schema.json" }
            example:
              sku: "ARR-001"
              descripcion: "Arroz (producto de prueba)"
              unidadMedida: "NIU"
              precioUnitario: 12.5
              codigoAfectacionIGV: "<codigo-por-verificar>"
              activo: true
      responses:
        "201":
          description: Producto creado.
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/product.schema.json" }
              example:
                id: "9de2dc65-dac7-4cd8-8d34-2550dd43cc9b"
                sku: "ARR-001"
                descripcion: "Arroz (producto de prueba)"
                unidadMedida: "NIU"
                precioUnitario: 12.5
                codigoAfectacionIGV: "<codigo-por-verificar>"
                activo: true
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /inventario/movimientos:
    get:
      tags: [Inventario]
      operationId: listInventoryMovements
      summary: Consultar movimientos de inventario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: productoId
          schema: { type: string, format: uuid }
        - in: query
          name: desde
          schema: { type: string, format: date-time }
        - in: query
          name: hasta
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Movimientos ordenados por fecha.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "../contracts/SCHEMAS/inventory-movement.schema.json" }
              example:
                - id: "e8b8e3f8-fc60-4a35-8a91-9b0a104030a2"
                  productoId: "9de2dc65-dac7-4cd8-8d34-2550dd43cc9b"
                  direccion: IN
                  cantidad: 20
                  unidadMedida: "NIU"
                  ocurridoEn: "2026-10-22T09:30:00Z"
                  origen: PURCHASE
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Inventario]
      operationId: createInventoryMovement
      summary: Registrar entrada o salida de inventario
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contracts/SCHEMAS/inventory-movement.schema.json" }
            example:
              productoId: "9de2dc65-dac7-4cd8-8d34-2550dd43cc9b"
              direccion: OUT
              cantidad: 2
              unidadMedida: "NIU"
              ocurridoEn: "2026-10-22T09:30:00Z"
              origen: SALE
              referenciaOrigen: "venta-local-987"
      responses:
        "201":
          description: Movimiento registrado.
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/inventory-movement.schema.json" }
              example:
                id: "e8b8e3f8-fc60-4a35-8a91-9b0a104030a2"
                productoId: "9de2dc65-dac7-4cd8-8d34-2550dd43cc9b"
                direccion: OUT
                cantidad: 2
                unidadMedida: "NIU"
                ocurridoEn: "2026-10-22T09:30:00Z"
                origen: SALE
                referenciaOrigen: "venta-local-987"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /comprobantes:
    post:
      tags: [Comprobantes]
      operationId: issueComprobante
      summary: Crear comprobante y solicitar emisión
      description: >-
        El correlativo y los totales los controla el servidor. La emisión y el envío
        se persisten como estados separados. Códigos y cálculos SUNAT POR VERIFICAR.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../contracts/SCHEMAS/sale.schema.json" }
            example:
              tipoCpe: "01"
              serie: "F001"
              fechaEmision: "2026-10-22"
              moneda: "PEN"
              cliente:
                tipoDocumento: "6"
                numeroDocumento: "20123456789"
                nombreLegal: "Cliente de prueba S.A.C."
              lineas:
                - sku: "ARR-001"
                  descripcion: "Arroz (producto de prueba)"
                  cantidad: 2
                  unidadMedida: "NIU"
                  precioUnitario: 12.5
                  codigoAfectacionIGV: "<codigo-por-verificar>"
      responses:
        "201":
          description: Comprobante creado y enviado a la política de entrega configurada.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/invoice.schema.json" }
              example:
                id: "4ded3922-1d58-4c4c-98a1-b8ce823a67ae"
                emisorRuc: "20123456786"
                tipoCpe: "01"
                serie: "F001"
                correlativo: "00000001"
                fechaEmision: "2026-10-22"
                moneda: "PEN"
                cliente:
                  tipoDocumento: "6"
                  numeroDocumento: "20123456789"
                  nombreLegal: "Cliente de prueba S.A.C."
                lineas:
                  - numeroLinea: 1
                    descripcion: "Arroz (producto de prueba)"
                    cantidad: 2
                    unidadMedida: "NIU"
                    precioUnitario: 12.5
                    descuento: 0
                    valorVenta: 25
                    codigoAfectacionIGV: "<codigo-por-verificar>"
                    impuestos:
                      - codigoTributo: "<codigo-por-verificar>"
                        baseImponible: 25
                        tasa: 18
                        importe: 4.5
                estado: SUBMITTED
                totales: { valorVenta: 25, impuestos: 4.5, importePagar: 29.5 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /comprobantes/{comprobanteId}:
    get:
      tags: [Comprobantes]
      operationId: getComprobante
      summary: Consultar comprobante
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ComprobanteId"
      responses:
        "200":
          description: Comprobante encontrado.
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/invoice.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /comprobantes/{comprobanteId}/envios:
    post:
      tags: [Envíos]
      operationId: submitComprobante
      summary: Enviar comprobante a SUNAT/OSE
      description: >-
        El puerto síncrono devuelve resultado/CDR en la respuesta. El puerto asíncrono
        devuelve ticket y exige GET /envios/{envioId}; timeout no implica rechazo.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ComprobanteId"
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canal, modo]
              properties:
                canal: { type: string, enum: [SUNAT_DIRECT, OSE] }
                modo: { type: string, enum: [SYNC, ASYNC] }
            example: { canal: SUNAT_DIRECT, modo: ASYNC }
      responses:
        "200":
          description: Resultado síncrono recibido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPortResponse" }
              example:
                envioId: "b806fb11-6b78-430c-865d-f1caf088aedd"
                estado: ACCEPTED
                cdrBase64: "<cdr-zip-base64-redactado>"
                codigoRespuesta: "<codigo-por-verificar>"
        "202":
          description: Solicitud aceptada para procesamiento asíncrono; resultado pendiente.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncPortResponse" }
              example:
                envioId: "b806fb11-6b78-430c-865d-f1caf088aedd"
                estado: PENDING
                ticket: "<ticket-por-respuesta-del-adaptador>"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /envios/{envioId}:
    get:
      tags: [Envíos]
      operationId: getSubmissionStatus
      summary: Consultar estado de envío/CDR
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: envioId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Estado actual e historial de consulta.
          content:
            application/json:
              schema:
                type: object
                required: [envioId, estado, actualizadoEn]
                properties:
                  envioId: { type: string, format: uuid }
                  estado: { type: string, enum: [PENDING, ACCEPTED, OBSERVED, REJECTED, UNKNOWN] }
                  ticket: { type: [string, "null"] }
                  codigoRespuesta: { type: [string, "null"] }
                  descripcion: { type: [string, "null"] }
                  actualizadoEn: { type: string, format: date-time }
              example:
                envioId: "b806fb11-6b78-430c-865d-f1caf088aedd"
                estado: PENDING
                ticket: "<ticket-por-respuesta-del-adaptador>"
                codigoRespuesta: null
                descripcion: null
                actualizadoEn: "2026-10-22T12:01:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /resumenes-diarios:
    post:
      tags: [Resúmenes]
      operationId: createDailySummary
      summary: Crear/enviar resumen diario
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fechaResumen, comprobantes]
              properties:
                fechaResumen: { type: string, format: date }
                comprobantes:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
            example:
              fechaResumen: "2026-10-22"
              comprobantes: ["4ded3922-1d58-4c4c-98a1-b8ce823a67ae"]
      responses:
        "202":
          description: Resumen aceptado para envío/procesamiento.
          content:
            application/json:
              schema: { $ref: "../contracts/SCHEMAS/daily-summary.schema.json" }
              example:
                id: "8a41bab4-d7c4-47d2-9ed8-058e7690fc81"
                fechaResumen: "2026-10-22"
                estado: PENDING
                ticket: "<ticket-por-respuesta-del-adaptador>"
                comprobantes: ["4ded3922-1d58-4c4c-98a1-b8ce823a67ae"]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Resúmenes]
      operationId: listDailySummaries
      summary: Buscar resúmenes diarios
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: fecha
          schema: { type: string, format: date }
      responses:
        "200":
          description: Resúmenes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "../contracts/SCHEMAS/daily-summary.schema.json" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /migraciones/legado:
    post:
      tags: [Migración]
      operationId: importLegacyRecords
      summary: Cargar lote de datos legados
      description: >-
        La carga se valida y pone en staging/cuarentena; no convierte numeraciones
        informales en comprobantes SUNAT ni sobrescribe evidencia original.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archivoOrigen, registros]
              properties:
                archivoOrigen: { type: string, minLength: 1, maxLength: 255 }
                registros:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      fecha: { type: [string, "null"] }
                      ingreso: { type: [string, number, "null"] }
                      salida: { type: [string, number, "null"] }
                      producto: { type: [string, "null"] }
                      nro_documento: { type: [string, "null"] }
            example:
              archivoOrigen: "inventario-legacy-01.csv"
              registros:
                - fecha: "2024-05-01"
                  ingreso: "10"
                  salida: null
                  producto: "ARROZ 5KG"
                  nro_documento: "compra 33"
      responses:
        "202":
          description: Lote recibido para validación; no significa que las filas se hayan migrado.
          content:
            application/json:
              schema:
                type: object
                required: [loteId, estado, filasRecibidas]
                properties:
                  loteId: { type: string, format: uuid }
                  estado: { type: string, enum: [RECEIVED, VALIDATING, COMPLETED, COMPLETED_WITH_ERRORS, REJECTED] }
                  filasRecibidas: { type: integer, minimum: 0 }
                  filasEnCuarentena: { type: integer, minimum: 0 }
              example:
                loteId: "19f67307-3e8d-4d02-b1fb-56ba09988a85"
                estado: RECEIVED
                filasRecibidas: 1
                filasEnCuarentena: 0
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ComprobanteId:
      in: path
      name: comprobanteId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      $ref: "../contracts/SCHEMAS/api-error.schema.json"
    SunatPortRequest:
      type: object
      description: Puerto de salida interno; no es endpoint público.
      required: [envioId, canal, idempotencyKey, documentoFirmadoBase64, mediaType]
      properties:
        envioId: { type: string, format: uuid }
        canal: { type: string, enum: [SUNAT_DIRECT, OSE] }
        idempotencyKey: { type: string }
        documentoFirmadoBase64: { type: string, contentEncoding: base64 }
        mediaType: { type: string, const: application/zip }
        correlationId: { type: string, format: uuid }
    SyncPortResponse:
      type: object
      description: Resultado final síncrono del puerto; código y CDR son datos del adaptador.
      required: [envioId, estado]
      properties:
        envioId: { type: string, format: uuid }
        estado: { type: string, enum: [ACCEPTED, OBSERVED, REJECTED, UNKNOWN] }
        codigoRespuesta: { type: [string, "null"] }
        cdrBase64: { type: [string, "null"], contentEncoding: base64 }
    AsyncPortResponse:
      type: object
      description: Aceptación técnica de envío asíncrono; no afirma aceptación tributaria.
      required: [envioId, estado]
      properties:
        envioId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDING, UNKNOWN] }
        ticket: { type: [string, "null"] }
  responses:
    BadRequest:
      description: Solicitud mal formada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No autenticado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicto de estado, correlativo o idempotencia.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Regla de negocio o perfil de validación incumplido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Límite de solicitudes alcanzado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Servicio de validación temporalmente no disponible.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: Error de comunicación con SUNAT/OSE; resultado puede ser desconocido.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Lote excede tamaño máximo admitido.
      content:
        application/json:
